<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteGitDriveSync Personal</title><style>body{max-width:760px;margin:48px auto;padding:0 24px;font:17px/1.8 system-ui;color:#222}h1{font-size:28px}a{color:#165fc0}</style><main><h1>NoteGitDriveSync Personal</h1><p>这是所有者本人使用的本机 Google Drive 文件同步工具。它通过 rclone 将指定的本机笔记目录与所有者的 Google Drive 文件夹进行双向同步，保留普通文件的原始格式。</p><p>应用不向其他用户提供服务，不收取费用，不开放笔记内容。本网站不提供登录或同步功能。</p><p><a href="privacy.html">隐私政策</a> · <a href="terms.html">使用说明</a></p></main></html>
